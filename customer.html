<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings | Benny and the Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E5551F;
      --secondary: #4ECDC4;
      --secondary-dark: #3AB5AD;
      --accent: #FFE66D;
      --dark: #2C3E50;
      --dark-light: #34495E;
      --text: #333333;
      --text-light: #666666;
      --bg: #FFFDF7;
      --bg-alt: #FFF8EE;
      --white: #FFFFFF;
      --success: #27AE60;
      --warning: #F39C12;
      --danger: #E74C3C;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
      --radius: 16px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Fredoka One', cursive;
      line-height: 1.2;
    }

    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar {
      background: rgba(255, 253, 247, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--accent);
      padding: 14px 0;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transition: transform var(--transition);
    }

    .logo:hover .logo-img { transform: scale(1.1) rotate(-5deg); }

    .logo-amp { color: var(--primary); margin: 0 2px; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--dark);
      padding: 8px 16px;
      border-radius: 50px;
      transition: all var(--transition);
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-links .nav-cta {
      background: var(--primary);
      color: var(--white) !important;
      padding: 10px 24px;
      font-weight: 800;
    }

    .nav-links .nav-cta:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }

    /* Main Content */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Lookup Section */
    .lookup-section {
      padding: 60px 0 40px;
      text-align: center;
    }

    .lookup-header h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--dark);
      margin-bottom: 8px;
    }

    .lookup-header p {
      color: var(--text-light);
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .lookup-form {
      background: var(--white);
      padding: 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 600px;
      margin: 0 auto;
    }

    .lookup-form .form-group {
      flex: 1;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      transition: border-color var(--transition);
      background: var(--bg);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--white);
    }

    .btn-secondary:hover {
      background: var(--secondary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--dark);
      border: 2px solid var(--dark);
    }

    .btn-outline:hover {
      background: var(--dark);
      color: var(--white);
    }

    .btn-sm {
      padding: 8px 20px;
      font-size: 0.9rem;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Results Area */
    .results-section {
      padding: 0 0 60px;
      display: none;
    }

    .results-section.visible { display: block; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .results-header h2 {
      font-size: 1.5rem;
      color: var(--dark);
    }

    .results-count {
      background: var(--accent);
      color: var(--dark);
      padding: 4px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
    }

    /* Booking Cards */
    .booking-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
      border-left: 5px solid var(--secondary);
      transition: all var(--transition);
      cursor: pointer;
    }

    .booking-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .booking-card.status-pending { border-left-color: var(--warning); }
    .booking-card.status-confirmed { border-left-color: var(--secondary); }
    .booking-card.status-completed { border-left-color: var(--success); }
    .booking-card.status-cancelled { border-left-color: var(--danger); }

    .booking-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .booking-card-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .booking-card-title h3 {
      font-size: 1.2rem;
      color: var(--dark);
    }

    .booking-card-title .dog-emoji {
      font-size: 1.8rem;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: #FFF3CD; color: #856404; }
    .badge-confirmed { background: #D1F2EB; color: #0E6655; }
    .badge-completed { background: #D5F5E3; color: #1E8449; }
    .badge-cancelled { background: #FADBD8; color: #922B21; }
    .badge-paid { background: #D5F5E3; color: #1E8449; }
    .badge-unpaid { background: #FADBD8; color: #922B21; }

    .booking-card-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-weight: 700;
      color: var(--dark);
      font-size: 0.95rem;
    }

    .booking-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    .booking-card-footer .badges {
      display: flex;
      gap: 8px;
    }

    .booking-card-footer .actions {
      display: flex;
      gap: 8px;
    }

    /* Expanded Booking Detail */
    .booking-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      padding: 24px;
    }

    .booking-detail-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .booking-detail-modal {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: transform var(--transition);
    }

    .booking-detail-overlay.active .booking-detail-modal {
      transform: scale(1) translateY(0);
    }

    .detail-modal-header {
      padding: 28px 28px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .detail-modal-header h2 {
      font-size: 1.5rem;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: var(--danger);
      color: var(--white);
    }

    .detail-modal-body {
      padding: 24px 28px 28px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-field.full-width {
      grid-column: 1 / -1;
    }

    .detail-field label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-field .value {
      font-weight: 700;
      color: var(--dark);
      font-size: 1rem;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      border: 1px solid #eee;
    }

    .status-timeline {
      margin-bottom: 24px;
    }

    .status-timeline h3 {
      font-size: 1rem;
      color: var(--dark);
      margin-bottom: 12px;
    }

    .timeline-steps {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .timeline-step {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .timeline-step .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e0e0e0;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--white);
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .timeline-step.active .step-dot {
      background: var(--secondary);
    }

    .timeline-step.complete .step-dot {
      background: var(--success);
    }

    .timeline-step.cancelled .step-dot {
      background: var(--danger);
    }

    .timeline-step .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .timeline-step.active .step-label,
    .timeline-step.complete .step-label {
      color: var(--dark);
    }

    .timeline-connector {
      height: 3px;
      flex: 0.5;
      background: #e0e0e0;
      margin-bottom: 20px;
    }

    .timeline-connector.filled {
      background: var(--success);
    }

    .payment-section {
      background: linear-gradient(135deg, var(--bg-alt), #FFF0DB);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }

    .payment-section h3 {
      font-size: 1.1rem;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .payment-section .amount {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .payment-section .payment-status-text {
      font-weight: 700;
      margin-bottom: 16px;
    }

    .payment-section .payment-status-text.paid {
      color: var(--success);
    }

    .payment-section .payment-status-text.unpaid {
      color: var(--warning);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty-state .empty-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 1.4rem;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-light);
      margin-bottom: 24px;
    }

    /* Loading state */
    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-state {
      text-align: center;
      padding: 40px;
    }

    .loading-state p {
      color: var(--text-light);
      margin-top: 12px;
      font-weight: 700;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--dark);
      color: var(--white);
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all var(--transition);
    }

    .toast.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }

    /* Footer */
    .footer {
      background: var(--dark);
      color: var(--white);
      padding: 24px 0;
      text-align: center;
      margin-top: 40px;
    }

    .footer p {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .footer a {
      color: var(--primary);
      font-weight: 700;
    }

    .footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 768px) {
      .lookup-form {
        flex-direction: column;
        align-items: stretch;
      }

      .lookup-form .btn { width: 100%; justify-content: center; }

      .nav-links { gap: 12px; }
      .nav-links a { padding: 6px 12px; font-size: 0.85rem; }

      .detail-grid { grid-template-columns: 1fr; }

      .booking-card-header { flex-direction: column; gap: 8px; }

      .booking-card-details {
        grid-template-columns: 1fr 1fr;
      }

      .booking-card-footer {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .results-header { flex-direction: column; gap: 8px; align-items: flex-start; }

      .timeline-steps { flex-wrap: wrap; gap: 4px; }
      .timeline-connector { display: none; }
    }

    @media (max-width: 480px) {
      .nav-links a:not(.nav-cta) { display: none; }
      .booking-card-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="images/logo.svg" alt="Benny and the Pets logo" class="logo-img">
        <span>Benny<span class="logo-amp">&</span>the Pets</span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/#services">Services</a>
        <a href="/#contact" class="nav-cta">Book a Stay</a>
      </div>
    </div>
  </nav>

  <!-- Lookup Section -->
  <section class="lookup-section">
    <div class="container">
      <div class="lookup-header">
        <h1>My Bookings &#128054;</h1>
        <p>Enter the email you used when booking to view your reservations and continue with payment.</p>
      </div>
      <form class="lookup-form" id="lookupForm">
        <div class="form-group">
          <label for="lookupEmail">Email Address</label>
          <input type="email" id="lookupEmail" placeholder="you@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary" id="lookupBtn">
          Find My Bookings
        </button>
      </form>
    </div>
  </section>

  <!-- Results Section -->
  <section class="results-section" id="resultsSection">
    <div class="container">
      <div class="results-header">
        <h2>Your Bookings</h2>
        <span class="results-count" id="resultsCount">0 bookings</span>
      </div>
      <div id="bookingsList"></div>
    </div>
  </section>

  <!-- Booking Detail Modal -->
  <div class="booking-detail-overlay" id="detailOverlay">
    <div class="booking-detail-modal">
      <div class="detail-modal-header">
        <h2 id="detailTitle">Booking Details</h2>
        <button class="close-btn" id="detailClose" aria-label="Close">&#10005;</button>
      </div>
      <div class="detail-modal-body" id="detailBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Benny and the Pets. <a href="/">Back to Home</a></p>
    </div>
  </footer>

  <script>
    // State
    let customerEmail = '';
    let bookings = [];

    // DOM Elements
    const lookupForm = document.getElementById('lookupForm');
    const lookupEmail = document.getElementById('lookupEmail');
    const lookupBtn = document.getElementById('lookupBtn');
    const resultsSection = document.getElementById('resultsSection');
    const resultsCount = document.getElementById('resultsCount');
    const bookingsList = document.getElementById('bookingsList');
    const detailOverlay = document.getElementById('detailOverlay');
    const detailTitle = document.getElementById('detailTitle');
    const detailBody = document.getElementById('detailBody');
    const detailClose = document.getElementById('detailClose');
    const toast = document.getElementById('toast');

    // Check URL params for pre-filled email or booking
    const urlParams = new URLSearchParams(window.location.search);
    const paramEmail = urlParams.get('email');
    const paramBooking = urlParams.get('booking');
    if (paramEmail) {
      lookupEmail.value = paramEmail;
      lookupForm.dispatchEvent(new Event('submit'));
    }

    // Toast helper
    function showToast(message, type = '') {
      toast.textContent = message;
      toast.className = 'toast ' + type;
      setTimeout(() => toast.classList.add('visible'), 10);
      setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    // Format cents to dollars
    function formatAmount(cents) {
      if (!cents && cents !== 0) return 'TBD';
      return '$' + (cents / 100).toFixed(2);
    }

    // Format date
    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Status display helpers
    function getStatusBadge(status) {
      const map = {
        pending: '<span class="badge badge-pending">Pending</span>',
        confirmed: '<span class="badge badge-confirmed">Confirmed</span>',
        completed: '<span class="badge badge-completed">Completed</span>',
        cancelled: '<span class="badge badge-cancelled">Cancelled</span>'
      };
      return map[status] || '<span class="badge badge-pending">' + status + '</span>';
    }

    function getPaymentBadge(status) {
      return status === 'paid'
        ? '<span class="badge badge-paid">Paid</span>'
        : '<span class="badge badge-unpaid">Unpaid</span>';
    }

    // Lookup bookings
    lookupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = lookupEmail.value.trim();
      if (!email) return;

      customerEmail = email;
      lookupBtn.disabled = true;
      lookupBtn.innerHTML = '<span class="loading-spinner"></span>';

      try {
        const res = await fetch('/api/bookings/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to look up bookings');
        }

        bookings = await res.json();
        renderBookings();
        resultsSection.classList.add('visible');

        if (bookings.length === 0) {
          showToast('No bookings found for this email', 'error');
        }

        // If booking param exists, auto-open that booking
        if (paramBooking) {
          const target = bookings.find(b => b.id == paramBooking);
          if (target) openDetail(target);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        lookupBtn.disabled = false;
        lookupBtn.textContent = 'Find My Bookings';
      }
    });

    // Render booking list
    function renderBookings() {
      resultsCount.textContent = bookings.length + ' booking' + (bookings.length !== 1 ? 's' : '');

      if (bookings.length === 0) {
        bookingsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#128062;</div>
            <h3>No Bookings Found</h3>
            <p>We couldn't find any bookings with that email address. Double-check the email or book a new stay!</p>
            <a href="/#contact" class="btn btn-primary">Book a Stay</a>
          </div>
        `;
        return;
      }

      bookingsList.innerHTML = bookings.map(booking => `
        <div class="booking-card status-${booking.status}" onclick="openDetail(bookings.find(b => b.id === ${booking.id}))">
          <div class="booking-card-header">
            <div class="booking-card-title">
              <span class="dog-emoji">&#128054;</span>
              <div>
                <h3>${escapeHtml(booking.dog_name)}'s ${escapeHtml(booking.service_name)}</h3>
                <span style="font-size:0.85rem;color:var(--text-light);">Booking #${booking.id}</span>
              </div>
            </div>
            ${getStatusBadge(booking.status)}
          </div>
          <div class="booking-card-details">
            <div class="detail-item">
              <span class="detail-label">Service</span>
              <span class="detail-value">${escapeHtml(booking.service_name)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Preferred Dates</span>
              <span class="detail-value">${escapeHtml(booking.preferred_dates) || 'Not specified'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Amount</span>
              <span class="detail-value">${formatAmount(booking.amount_cents)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Booked On</span>
              <span class="detail-value">${formatDate(booking.created_at)}</span>
            </div>
          </div>
          <div class="booking-card-footer">
            <div class="badges">
              ${getStatusBadge(booking.status)}
              ${getPaymentBadge(booking.payment_status)}
            </div>
            <div class="actions">
              ${booking.payment_status !== 'paid' && booking.status !== 'cancelled' ? `
                <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); initiatePayment(${booking.id})">
                  Pay Now
                </button>
              ` : ''}
              <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openDetail(bookings.find(b => b.id === ${booking.id}))">
                View Details
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Open booking detail modal
    function openDetail(booking) {
      if (!booking) return;

      detailTitle.innerHTML = `&#128054; ${escapeHtml(booking.dog_name)}'s Booking`;

      // Build timeline
      const statusOrder = ['pending', 'confirmed', 'completed'];
      const currentIndex = statusOrder.indexOf(booking.status);
      const isCancelled = booking.status === 'cancelled';

      let timelineHtml = '<div class="status-timeline"><h3>Booking Status</h3><div class="timeline-steps">';
      statusOrder.forEach((step, i) => {
        let stepClass = '';
        if (isCancelled) {
          stepClass = i === 0 ? 'cancelled' : '';
        } else if (i < currentIndex) {
          stepClass = 'complete';
        } else if (i === currentIndex) {
          stepClass = 'active';
        }

        const icons = { pending: '&#128203;', confirmed: '&#9989;', completed: '&#127881;' };

        timelineHtml += `
          <div class="timeline-step ${stepClass}">
            <div class="step-dot">${isCancelled && i === 0 ? '&#10005;' : icons[step]}</div>
            <div class="step-label">${step.charAt(0).toUpperCase() + step.slice(1)}</div>
          </div>
        `;

        if (i < statusOrder.length - 1) {
          const filled = !isCancelled && i < currentIndex ? 'filled' : '';
          timelineHtml += `<div class="timeline-connector ${filled}"></div>`;
        }
      });
      timelineHtml += '</div></div>';

      if (isCancelled) {
        timelineHtml = `
          <div class="status-timeline">
            <h3>Booking Status</h3>
            <div style="background:#FADBD8;padding:14px 20px;border-radius:var(--radius-sm);text-align:center;">
              <span style="font-weight:800;color:#922B21;">This booking has been cancelled.</span>
            </div>
          </div>
        `;
      }

      // Payment section
      let paymentHtml = `
        <div class="payment-section">
          <h3>Payment</h3>
          <div class="amount">${formatAmount(booking.amount_cents)}</div>
          <div class="payment-status-text ${booking.payment_status}">
            ${booking.payment_status === 'paid' ? 'Payment Complete' : 'Payment Pending'}
          </div>
          ${booking.payment_status !== 'paid' && booking.status !== 'cancelled' ? `
            <button class="btn btn-primary" onclick="initiatePayment(${booking.id})">
              Continue to Payment
            </button>
          ` : ''}
          ${booking.payment_status === 'paid' ? '<p style="color:var(--success);font-weight:700;font-size:0.9rem;">Thank you for your payment!</p>' : ''}
        </div>
      `;

      detailBody.innerHTML = `
        ${timelineHtml}
        <div class="detail-grid">
          <div class="detail-field">
            <label>Owner Name</label>
            <div class="value">${escapeHtml(booking.owner_name)}</div>
          </div>
          <div class="detail-field">
            <label>Email</label>
            <div class="value">${escapeHtml(booking.email)}</div>
          </div>
          <div class="detail-field">
            <label>Phone</label>
            <div class="value">${escapeHtml(booking.phone) || 'Not provided'}</div>
          </div>
          <div class="detail-field">
            <label>Dog's Name</label>
            <div class="value">${escapeHtml(booking.dog_name)}</div>
          </div>
          <div class="detail-field">
            <label>Service</label>
            <div class="value">${escapeHtml(booking.service_name)}</div>
          </div>
          <div class="detail-field">
            <label>Preferred Dates</label>
            <div class="value">${escapeHtml(booking.preferred_dates) || 'Not specified'}</div>
          </div>
          ${booking.message ? `
            <div class="detail-field full-width">
              <label>Special Notes</label>
              <div class="value">${escapeHtml(booking.message)}</div>
            </div>
          ` : ''}
          <div class="detail-field">
            <label>Booked On</label>
            <div class="value">${formatDate(booking.created_at)}</div>
          </div>
          <div class="detail-field">
            <label>Last Updated</label>
            <div class="value">${formatDate(booking.updated_at)}</div>
          </div>
        </div>
        ${paymentHtml}
      `;

      detailOverlay.classList.add('active');
    }

    // Close detail modal
    detailClose.addEventListener('click', () => {
      detailOverlay.classList.remove('active');
    });

    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) {
        detailOverlay.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') detailOverlay.classList.remove('active');
    });

    // Initiate payment
    async function initiatePayment(bookingId) {
      try {
        const res = await fetch('/api/payments/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: bookingId })
        });

        if (!res.ok) {
          const err = await res.json();
          // If Stripe isn't configured, try the checkout session route instead
          if (res.status === 503) {
            showToast('Online payment is not yet configured. Please contact us to arrange payment.', 'error');
            return;
          }
          throw new Error(err.error || 'Payment failed');
        }

        const data = await res.json();
        showToast('Payment initiated! Amount: ' + formatAmount(data.amount), 'success');
        // In a real setup with Stripe Elements, you'd mount the payment form here.
        // For now show a helpful message.
        showToast('Please contact Benny and the Pets to complete your payment.', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // HTML escape
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
