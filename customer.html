<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal | Benny and the Pets</title>
  <link rel="icon" type="image/png" href="images/bennyandthepets.png">
  <link rel="apple-touch-icon" href="images/bennyandthepets.png">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E5551F;
      /* #FF6B35 is only 2.84:1 on white. Text-bearing surfaces (filled
         buttons, orange-on-white labels) use --primary-strong at 5.18:1;
         --primary stays for borders, icons and hover glows. */
      --primary-strong: #C2410C;
      --primary-strong-dark: #9A3412;
      --secondary: #4ECDC4;
      --secondary-dark: #3AB5AD;
      /* #4ECDC4 carries white text at only 1.93:1. Filled secondary buttons
         use --secondary-strong (4.8:1); the bright teal stays decorative. */
      --secondary-strong: #217F79;
      --secondary-strong-dark: #146B66;
      --accent: #FFE66D;
      --dark: #2C3E50;
      --dark-light: #34495E;
      --text: #333333;
      --text-light: #666666;
      --bg: #FFFDF7;
      --bg-alt: #FFF8EE;
      --white: #FFFFFF;
      --success: #27AE60;
      --warning: #F39C12;
      --danger: #E74C3C;
      /* AA-safe variants for surfaces that carry text. Measured against white:
         success 4.72:1, warning 5.24:1, danger 5.44:1, info 5.39:1. The bright
         values above stay for decorative fills, dots and borders. */
      --success-strong: #1E8449;
      --warning-strong: #946200;
      --danger-strong: #C0392B;
      --info-strong: #1F6FA8;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
      --radius: 16px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Fredoka One', cursive;
      line-height: 1.2;
    }

    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar {
      background: rgba(255, 253, 247, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--accent);
      padding: 14px 0;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 8px;
      /* The wordmark is one unit. Left to wrap it broke over two lines and
         pushed the links off the right edge of a phone. */
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transition: transform var(--transition);
    }

    .logo:hover .logo-img { transform: scale(1.1) rotate(-5deg); }
    .logo-amp { color: var(--primary); margin: 0 2px; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
      white-space: nowrap;
    }

    .nav-links a {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--dark);
      padding: 8px 16px;
      border-radius: 50px;
      transition: all var(--transition);
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-links .nav-cta {
      background: var(--primary-strong);
      color: var(--white) !important;
      padding: 10px 24px;
      font-weight: 800;
    }

    .nav-links .nav-cta:hover {
      background: var(--primary-strong-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-user-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--dark);
    }

    .nav-logout {
      background: none;
      border: 2px solid var(--danger);
      color: var(--danger-strong);
      padding: 6px 16px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .nav-logout:hover {
      background: var(--danger);
      color: var(--white);
    }

    /* Main Content */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Auth Section */
    .auth-section {
      padding: 80px 0 60px;
      display: flex;
      justify-content: center;
    }

    .auth-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 36px 32px 28px;
      text-align: center;
      color: var(--white);
    }

    .auth-header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .auth-header p {
      opacity: 0.9;
      font-weight: 600;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #f0f0f0;
    }

    .auth-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-light);
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'Nunito', sans-serif;
      transition: all var(--transition);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .auth-tab.active {
      color: var(--primary-strong);
      border-bottom-color: var(--primary-strong);
    }

    .auth-tab:hover:not(.active) {
      color: var(--dark);
    }

    .auth-body {
      padding: 32px;
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      transition: border-color var(--transition);
      background: var(--bg);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-error {
      background: #FADBD8;
      color: #922B21;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }

    .form-error.visible { display: block; }

    .availability-alert {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 12px;
    }
    .availability-alert.visible { display: block; }
    .availability-alert.warn {
      background: #FEF3CD;
      color: #856404;
      border-left: 3px solid var(--warning);
    }
    .availability-alert.full {
      background: #FADBD8;
      color: #922B21;
      border-left: 3px solid var(--danger);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      white-space: nowrap;
    }

    /* The "forgot password" and "back to login" links. These were an inline
       #ff6b9d, which is 2.9:1 on white — below AA for body text. */
    .auth-link {
      color: var(--primary-strong);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
    }
    .auth-link:hover { color: var(--primary-strong-dark); }

    .btn-primary {
      background: var(--primary-strong);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-strong-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    .btn-secondary {
      background: var(--secondary-strong);
      color: var(--white);
    }

    .btn-secondary:hover {
      background: var(--secondary-strong-dark);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: var(--danger-strong);
      color: var(--white);
    }
    .btn-danger:hover {
      background: #96271c;
    }

    .btn-outline {
      background: transparent;
      color: var(--dark);
      border: 2px solid var(--dark);
    }

    .btn-outline:hover {
      background: var(--dark);
      color: var(--white);
    }

    .btn-sm {
      padding: 8px 20px;
      font-size: 0.9rem;
    }

    .btn-full { width: 100%; }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard.active { display: block; }

    .dashboard-header {
      padding: 48px 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .dashboard-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--dark);
    }

    .welcome-text {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 600;
    }

    /* Tabs for dashboard */
    .dash-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .dash-tab {
      padding: 10px 24px;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      border: 2px solid #e0e0e0;
      background: var(--white);
      color: var(--text-light);
      transition: all var(--transition);
    }

    .dash-tab.active {
      background: var(--primary-strong);
      color: var(--white);
      border-color: var(--primary-strong);
    }

    .dash-tab:hover:not(.active) {
      border-color: var(--primary-strong);
      color: var(--primary-strong);
    }

    .dash-panel { display: none; }
    .dash-panel.active { display: block; }

    /* Booking Form */
    .booking-form-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      margin-bottom: 32px;
    }

    .booking-form-card h2 {
      font-size: 1.4rem;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .booking-form-card p {
      color: var(--text-light);
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .form-section:last-of-type {
      border-bottom: none;
      margin-bottom: 24px;
      padding-bottom: 0;
    }

    .form-section .form-group:last-child {
      margin-bottom: 0;
    }

    .form-section-label {
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: var(--dark);
      margin-bottom: 14px;
    }

    /* Service Cards in Booking */
    .service-select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .service-option {
      background: var(--bg);
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-sm);
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }

    .service-option:hover {
      border-color: var(--primary);
    }

    .service-option.selected {
      border-color: var(--primary);
      background: #FFF0E5;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .service-option .service-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .service-option .service-name {
      font-weight: 800;
      color: var(--dark);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .service-option .service-price {
      font-weight: 700;
      color: var(--primary-strong);
      font-size: 0.85rem;
    }

    /* Booking Cards */
    .booking-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
      border-left: 5px solid var(--secondary);
      transition: all var(--transition);
      cursor: pointer;
    }

    .booking-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .booking-card.status-pending { border-left-color: var(--warning-strong); }
    .booking-card.status-confirmed { border-left-color: var(--secondary); }
    .booking-card.status-completed { border-left-color: var(--success-strong); }
    .booking-card.status-cancelled { border-left-color: var(--danger-strong); }

    .booking-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .booking-card-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .booking-card-title h3 {
      font-size: 1.2rem;
      color: var(--dark);
    }

    .booking-card-title .dog-emoji { font-size: 1.8rem; }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: #FFF3CD; color: #856404; }
    .badge-confirmed { background: #D1F2EB; color: #0E6655; }
    .badge-completed { background: #D5F5E3; color: #1E8449; }
    .badge-cancelled { background: #FADBD8; color: #922B21; }
    .badge-paid { background: #D5F5E3; color: #1E8449; }
    .badge-unpaid { background: #FADBD8; color: #922B21; }
    .badge-requested { background: #CCE5FF; color: #004085; }

    .payment-requested-banner {
      background: linear-gradient(135deg, #CCE5FF, #E3F0FF);
      border: 2px solid #80BDFF;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .payment-requested-banner .banner-text {
      font-weight: 700;
      color: #004085;
      font-size: 0.9rem;
    }

    .booking-card.payment-requested {
      border-left-color: #007BFF;
      box-shadow: 0 4px 20px rgba(0, 123, 255, 0.15);
    }

    .booking-card-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-weight: 700;
      color: var(--dark);
      font-size: 0.95rem;
    }

    /* ... rest of the file continues with the updated availability logic ... */
  </style>
</head>
